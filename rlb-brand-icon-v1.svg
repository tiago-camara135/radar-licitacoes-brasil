<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Radar de Licitações Brasil</title>
  <desc id="desc">Documento com radar, símbolo da plataforma Radar de Licitações Brasil</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="54" x2="445" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#03B87E"/>
      <stop offset="0.52" stop-color="#069D9E"/>
      <stop offset="1" stop-color="#078BC8"/>
    </linearGradient>
    <linearGradient id="paper" x1="160" y1="140" x2="340" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF9F4"/>
    </linearGradient>
    <linearGradient id="fold" x1="295" y1="140" x2="355" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7FFFB"/>
      <stop offset="1" stop-color="#9CEBDF"/>
    </linearGradient>
    <radialGradient id="radarFace" cx="46%" cy="42%" r="72%">
      <stop stop-color="#098D86"/>
      <stop offset="1" stop-color="#006D8E"/>
    </radialGradient>
    <linearGradient id="beam" x1="318" y1="318" x2="430" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BFFFF8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#59FFF2" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#002C42" flood-opacity="0.22"/>
    </filter>
    <filter id="radarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#35E8E5" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="42" y="42" width="428" height="428" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <path d="M147 135c0-22 18-40 40-40h125l73 73v180c0 22-18 40-40 40H187c-22 0-40-18-40-40V135Z" fill="url(#paper)"/>
  <path d="M312 95v56c0 17 14 31 31 31h42l-73-87Z" fill="url(#fold)"/>
  <rect x="183" y="171" width="110" height="16" rx="8" fill="#0A9A83"/>
  <rect x="183" y="207" width="92" height="16" rx="8" fill="#0A9A83"/>
  <rect x="183" y="243" width="58" height="16" rx="8" fill="#0A9A83"/>

  <g filter="url(#radarGlow)">
    <circle cx="321" cy="322" r="124" fill="url(#radarFace)"/>
    <circle cx="321" cy="322" r="95" fill="none" stroke="#C8FFF9" stroke-width="10" stroke-opacity="0.88"/>
    <circle cx="321" cy="322" r="63" fill="none" stroke="#63DED6" stroke-width="9" stroke-opacity="0.78"/>
    <circle cx="321" cy="322" r="31" fill="none" stroke="#47C9C8" stroke-width="8" stroke-opacity="0.68"/>
    <path d="M321 322 420 230a128 128 0 0 1 24 39L321 322Z" fill="url(#beam)"/>
    <circle cx="321" cy="322" r="15" fill="#F7FFFE"/>
  </g>
</svg>
