<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Radar de Licitacoes Brasil</title>
  <desc id="desc">Simbolo minimalista de radar com ondas concentricas e feixe de varredura.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D344B"/>
      <stop offset="1" stop-color="#061827"/>
    </linearGradient>
    <linearGradient id="rings" x1="80" y1="90" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58F4D7"/>
      <stop offset="1" stop-color="#08B99E"/>
    </linearGradient>
    <linearGradient id="beam" x1="256" y1="256" x2="420" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9FFFC" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#34E6C8" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="118" fill="url(#bg)"/>
  <g fill="none" stroke="url(#rings)" filter="url(#glow)">
    <circle cx="256" cy="256" r="176" stroke-width="15" opacity="0.96"/>
    <circle cx="256" cy="256" r="119" stroke-width="13" opacity="0.90"/>
    <circle cx="256" cy="256" r="63" stroke-width="11" opacity="0.82"/>
  </g>
  <path d="M256 256 385 127a183 183 0 0 1 40 43L256 256Z" fill="url(#beam)"/>
  <path d="M256 256 389 123" fill="none" stroke="#F4FFFD" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="18" fill="#F4FFFD"/>
  <circle cx="256" cy="256" r="7" fill="#0AAE9C"/>
</svg>