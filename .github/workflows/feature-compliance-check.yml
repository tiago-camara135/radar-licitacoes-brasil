name: Feature Compliance Matrix Check

on:
  push:
    branches: [feature-compliance-matrix-v2]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar_test_password
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --omit=dev
      - name: Syntax checks
        run: find . -type f \( -name '*.mjs' -o -name '*.js' \) -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: npm test
      - name: Runtime smoke
        env:
          DATABASE_URL: postgresql://radar:radar_test_password@127.0.0.1:5432/radar_test?sslmode=disable
          NODE_ENV: test
          PORT: "10000"
          APP_ORIGIN: "https://configured.example.test"
          ACCOUNT_RECOVERY_SECRET: "ci-only-account-recovery-secret-not-for-production"
          ACCOUNT_RECOVERY_EMAIL_TEST_MODE: "1"
          RLB_MIGRATION_RUN: "0"
          RLB_MIGRATION_FREEZE: "0"
          PNCP_MAX_RETRIES: "0"
        run: |
          npm start > /tmp/rlb-feature.log 2>&1 &
          echo $! > /tmp/rlb-feature.pid
          cleanup() { kill $(cat /tmp/rlb-feature.pid) 2>/dev/null || true; }
          trap cleanup EXIT
          node test/integration-smoke.mjs
          node test/browser-origin-smoke.mjs
          node test/frontend-runtime-smoke.mjs
          node test/tender-intelligence-runtime-smoke.mjs
