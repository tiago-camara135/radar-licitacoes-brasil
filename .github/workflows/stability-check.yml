name: Stability Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar_test_password
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --omit=dev
      - name: Syntax checks — whole codebase
        run: |
          find . -type f \( -name '*.mjs' -o -name '*.js' \) -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: npm test
      - name: Authenticated browser-like integration smoke
        env:
          DATABASE_URL: postgresql://radar:radar_test_password@127.0.0.1:5432/radar_test?sslmode=disable
          NODE_ENV: test
          PORT: "10000"
          APP_ORIGIN: "https://configured.example.test"
          RLB_MIGRATION_RUN: "0"
          RLB_MIGRATION_FREEZE: "0"
          PNCP_MAX_RETRIES: "0"
        run: |
          npm start > /tmp/rlb-integration.log 2>&1 &
          echo $! > /tmp/rlb-integration.pid
          cleanup() { kill $(cat /tmp/rlb-integration.pid) 2>/dev/null || true; }
          trap cleanup EXIT
          if ! node test/integration-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
          if ! node test/browser-origin-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
          if ! node test/frontend-runtime-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
      - name: Production read-only smoke
        run: node test/production-readonly-smoke.mjs
