name: Stability Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar_test_password
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --omit=dev
      - name: Create least-privilege CI application role
        env:
          DATABASE_URL: postgresql://radar:radar_test_password@127.0.0.1:5432/radar_test?sslmode=disable
        run: node test/restrict-ci-db-role.mjs
      - name: Syntax checks — whole codebase
        run: |
          find . -type f \( -name '*.mjs' -o -name '*.js' \) -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: npm test
      - name: Authenticated browser-like integration smoke
        timeout-minutes: 8
        env:
          DATABASE_URL: postgresql://radar_app:radar_app_test_password@127.0.0.1:5432/radar_test?sslmode=disable
          NODE_ENV: test
          PORT: "10000"
          APP_ORIGIN: "https://configured.example.test"
          ACCOUNT_RECOVERY_SECRET: "ci-only-account-recovery-secret-not-for-production"
          ACCOUNT_RECOVERY_EMAIL_TEST_MODE: "1"
          RLB_MIGRATION_RUN: "0"
          RLB_MIGRATION_FREEZE: "0"
          PNCP_MAX_RETRIES: "0"
        run: |
          npm start > /tmp/rlb-integration.log 2>&1 &
          echo $! > /tmp/rlb-integration.pid
          cleanup() {
            kill $(cat /tmp/rlb-integration.pid) 2>/dev/null || true
            if [ -f /tmp/rlb-browser.pid ]; then
              kill $(cat /tmp/rlb-browser.pid) 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          if ! timeout --signal=TERM --kill-after=5s 60s node test/integration-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
          if ! timeout --signal=TERM --kill-after=5s 60s node test/browser-origin-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
          if ! timeout --signal=TERM --kill-after=5s 60s node test/rate-limit-ip-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
          if ! timeout --signal=TERM --kill-after=5s 60s node test/frontend-runtime-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
          if ! timeout --signal=TERM --kill-after=5s 60s node test/tender-intelligence-runtime-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
          if ! timeout --signal=TERM --kill-after=5s 60s node test/tender-compliance-v3-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
          if ! timeout --signal=TERM --kill-after=5s 60s node test/account-recovery-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
          if ! timeout --signal=TERM --kill-after=5s 60s node test/account-recovery-history-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
          if ! timeout --signal=TERM --kill-after=5s 60s node test/user-dashboard-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
          if ! timeout --signal=TERM --kill-after=5s 60s node test/admin-center-smoke.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-integration.log
            exit 1
          fi
          # Chrome is already installed on GitHub-hosted Ubuntu images; install only
          # the lightweight automation protocol client, never a browser bundle.
          timeout 120s npm install --no-save --ignore-scripts playwright-core@1.55.0
          # Browser integration uses a separate Node process/rate-limit bucket on
          # the same isolated test database. The production limiter is unchanged.
          PORT=10001 node production-v34.mjs > /tmp/rlb-browser.log 2>&1 &
          echo $! > /tmp/rlb-browser.pid
          if ! timeout --signal=TERM --kill-after=10s 180s env RLB_TEST_BASE_URL=http://127.0.0.1:10001 node test/real-browser-e2e-smoke.mjs; then
            echo "--- browser e2e failed, isolated server log ---"
            tail -n 180 /tmp/rlb-browser.log
            exit 1
          fi
          kill $(cat /tmp/rlb-browser.pid) 2>/dev/null || true
