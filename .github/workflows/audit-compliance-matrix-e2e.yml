name: Compliance Matrix Controlled E2E

on:
  push:
    branches: [audit-compliance-matrix-e2e]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar_test_password
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --omit=dev
      - name: Controlled company x edital E2E
        env:
          DATABASE_URL: postgresql://radar:radar_test_password@127.0.0.1:5432/radar_test?sslmode=disable
          NODE_ENV: test
          PORT: "10000"
          APP_ORIGIN: "http://127.0.0.1:10000"
          ACCOUNT_RECOVERY_SECRET: "audit-only-secret"
          ACCOUNT_RECOVERY_EMAIL_TEST_MODE: "1"
          RLB_MIGRATION_RUN: "0"
          RLB_MIGRATION_FREEZE: "0"
          PNCP_MAX_RETRIES: "0"
        run: |
          npm start > /tmp/rlb-matrix-e2e.log 2>&1 &
          echo $! > /tmp/rlb-matrix-e2e.pid
          cleanup() { kill $(cat /tmp/rlb-matrix-e2e.pid) 2>/dev/null || true; }
          trap cleanup EXIT
          if ! node scripts/audit-compliance-matrix-e2e.mjs; then
            echo "--- server log ---"
            cat /tmp/rlb-matrix-e2e.log
            exit 1
          fi
