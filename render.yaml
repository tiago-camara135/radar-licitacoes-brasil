services:
  - type: web
    name: radar-licitacoes-brasil-app
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: PNCP_BASE_URL
        value: https://pncp.gov.br/api/consulta
      - key: PNCP_OPERATION_TIMEZONE
        value: America/Sao_Paulo
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ORIGIN
        sync: false
